name: Fix connect page route

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose route tree
        run: |
          {
            echo "## apps/web/app tree"
            echo '```'
            find apps/web/app -type f 2>/dev/null | sort || echo "(no apps/web/app directory)"
            echo '```'
            echo ""
            echo "## apps/web/src/app tree (if it exists)"
            echo '```'
            find apps/web/src/app -type f 2>/dev/null | sort || echo "(no apps/web/src/app directory)"
            echo '```'
            echo ""
            if [ -f apps/web/app/connect/deepseek/page.tsx ]; then
              echo "**page.tsx EXISTS at apps/web/app/connect/deepseek/page.tsx**"
            else
              echo "**page.tsx MISSING at apps/web/app/connect/deepseek/page.tsx**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write connect page
        run: |
          mkdir -p apps/web/app/connect/deepseek
          cat > apps/web/app/connect/deepseek/page.tsx << 'PAGE_EOF'
          "use client";

          import { useEffect, useRef, useState } from "react";

          type Status =
            | { status: "idle" }
            | { status: "starting" }
            | { status: "pending"; liveUrl: string; expiresAt: number; message: string }
            | { status: "connected"; accountHint?: string; verified: string[] }
            | { status: "failed"; error: string }
            | { status: "expired" }
            | { status: "not_found" };

          export default function ConnectDeepSeek() {
            const [state, setState] = useState<Status>({ status: "idle" });
            const [connectId, setConnectId] = useState<string | null>(null);
            const pollRef = useRef<ReturnType<typeof setInterval> | null>(null);

            useEffect(() => {
              if (state.status === "idle") void start();
              return () => {
                if (pollRef.current) clearInterval(pollRef.current);
              };
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            async function start() {
              setState({ status: "starting" });
              try {
                const res = await fetch("/api/connect/deepseek", { method: "POST" });
                const json = await res.json();
                if (!res.ok) throw new Error(json.error ?? res.statusText);
                setConnectId(json.connectId);
                setState({
                  status: "pending",
                  liveUrl: json.liveUrl,
                  expiresAt: json.expiresAt,
                  message: "Waiting for login...",
                });
                startPolling(json.connectId);
              } catch (e) {
                setState({ status: "failed", error: (e as Error).message });
              }
            }

            function startPolling(id: string) {
              if (pollRef.current) clearInterval(pollRef.current);
              pollRef.current = setInterval(async () => {
                try {
                  const res = await fetch(`/api/connect/deepseek/${id}`);
                  const json = await res.json();
                  if (json.status === "connected") {
                    if (pollRef.current) clearInterval(pollRef.current);
                    setState({
                      status: "connected",
                      accountHint: json.accountHint,
                      verified: json.verified ?? [],
                    });
                    return;
                  }
                  if (json.status === "failed" || json.status === "expired") {
                    if (pollRef.current) clearInterval(pollRef.current);
                    setState(json);
                    return;
                  }
                  if (json.status === "pending") {
                    setState({
                      status: "pending",
                      liveUrl: json.liveUrl,
                      expiresAt: json.expiresAt,
                      message: json.message,
                    });
                    return;
                  }
                  if (json.status === "not_found") {
                    if (pollRef.current) clearInterval(pollRef.current);
                    setState({ status: "not_found" });
                  }
                } catch {
                  // transient network error — keep polling
                }
              }, 2000);
            }

            async function cancel() {
              if (!connectId) return;
              if (pollRef.current) clearInterval(pollRef.current);
              await fetch(`/api/connect/deepseek/${connectId}/cancel`, { method: "POST" });
              setState({ status: "idle" });
              setConnectId(null);
            }

            return (
              <main style={{ padding: 32, maxWidth: 900, margin: "0 auto" }}>
                <h1 style={{ marginBottom: 4 }}>Connect DeepSeek</h1>
                <p style={{ color: "#666", marginTop: 0 }}>
                  Log in to DeepSeek below. Cookies and UI selectors are captured
                  automatically when login succeeds.
                </p>

                {state.status === "starting" && <p>Starting remote browser...</p>}

                {state.status === "pending" && (
                  <>
                    <div
                      style={{
                        marginTop: 16,
                        padding: 12,
                        background: "#e8f4ff",
                        borderRadius: 6,
                        fontSize: 14,
                      }}
                    >
                      <strong>Log in to DeepSeek in the panel below.</strong> When you're
                      signed in, this page will detect it and finish automatically.
                    </div>

                    <iframe
                      src={state.liveUrl}
                      style={{
                        marginTop: 16,
                        width: "100%",
                        height: 640,
                        border: "1px solid #ccc",
                        borderRadius: 6,
                      }}
                      allow="clipboard-read; clipboard-write"
                    />

                    <div style={{ marginTop: 12 }}>
                      <button onClick={cancel}>Cancel</button>
                    </div>
                  </>
                )}

                {state.status === "connected" && (
                  <div
                    style={{
                      marginTop: 24,
                      padding: 20,
                      background: "#e8ffe8",
                      borderRadius: 6,
                    }}
                  >
                    <h3 style={{ marginTop: 0 }}>Connected ✓</h3>
                    {state.accountHint && (
                      <p style={{ marginBottom: 8 }}>
                        Account: <strong>{state.accountHint}</strong>
                      </p>
                    )}
                    <p style={{ marginBottom: 0, fontSize: 13, color: "#555" }}>
                      Verified selectors: {state.verified.join(", ") || "none"}
                      <br />
                      Stop and message selectors use defaults — they'll be validated on
                      first use.
                    </p>
                    <div style={{ marginTop: 16 }}>
                      <a href="/">← Back to dashboard</a>
                    </div>
                  </div>
                )}

                {state.status === "failed" && (
                  <div style={{ marginTop: 24, color: "#a00" }}>
                    <p>Connection failed: {state.error}</p>
                    <button onClick={start}>Try again</button>
                  </div>
                )}

                {(state.status === "expired" || state.status === "not_found") && (
                  <div style={{ marginTop: 24 }}>
                    <p>
                      {state.status === "expired"
                        ? "The connect session timed out."
                        : "That connect session is no longer active."}
                    </p>
                    <button onClick={start}>Start over</button>
                  </div>
                )}
              </main>
            );
          }
          PAGE_EOF

          # Strip the 10-space indent the YAML heredoc added.
          sed -i 's/^          //' apps/web/app/connect/deepseek/page.tsx

          echo "Wrote $(wc -l < apps/web/app/connect/deepseek/page.tsx) lines"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/connect/deepseek/page.tsx
          if git diff --cached --quiet; then
            echo "::notice::No change — page already present and identical"
            exit 0
          fi
          git commit -m "fix(web): restore connect/deepseek page route"
          git push
          echo "::notice::Committed. Vercel will rebuild."
